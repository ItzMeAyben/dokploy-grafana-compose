services:
  grafana:
    build:
      context: ./monitoring/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    networks:
      - dokploy-network
    restart: on-failure:3
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    expose:
      - 3000
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  loki:
    build:
      context: ./monitoring/loki
    command: -config.file=/etc/loki/config.yml
    volumes:
      - loki-data:/loki
    networks:
      - dokploy-network
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    expose:
      - 3100
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  tempo:
    build:
      context: ./monitoring/tempo
    command: -config.file=/etc/tempo/config.yml
    volumes:
      - tempo-data:/var/tempo
    networks:
      - dokploy-network
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3200/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    expose:
      - 3200
      - 4317
      - 4318
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-remote-write-receiver
    volumes:
      - prometheus-data:/prometheus
    networks:
      - dokploy-network
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    expose:
      - 9090
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  alloy:
    build:
      context: ./monitoring/alloy
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - HOST_NAME=${HOST_NAME:-observability-hub}
    volumes:
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      prometheus:
        condition: service_healthy
      node-exporter:
        condition: service_started
      cadvisor:
        condition: service_started
    networks:
      - dokploy-network
    restart: on-failure:3
    expose:
      - 12345 # Alloy UI / self-metrics
      - 9090 # Prometheus remote_write ingest
      - 3500 # Loki push ingest
      - 4317 # OTLP gRPC ingest
      - 4318 # OTLP HTTP ingest
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - dokploy-network
    restart: on-failure:3
    expose:
      - 9100
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - dokploy-network
    restart: on-failure:3
    expose:
      - 8080
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

networks:
  default:
    name: dokploy-network
    external: true
  dokploy-network:
    external: true

volumes:
  grafana-data:
  loki-data:
  tempo-data:
  prometheus-data:
  alloy-data:
